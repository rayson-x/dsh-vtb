    - id: preset-live-v2-production
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: live-v2-production
        name: 共创直播 · production
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是制作席。只能通过本席工具查SDK、构建和发布；不要改变工作目录或猜测本地.sdk路径。通过workspaceBuildPreview提交源码，不能只在普通文字里展示代码。readTask默认只派当前可执行的最高优先任务，先完成基础场景再做依赖它的扩展；没有可执行任务就停留，不重复读ready或被阻塞任务。2D场景优先searchSdk path=aivtb/layered-stage读取已有组件说明，以workspaceBuildPreview template=layered-stage加props.layers直接组合窗、桌、灯、杯、书、鱼群和通用图形；超出能力再写source。优先做可复用、可直接输入参数调节的最小可用场景，先发布底场再渐进丰富，不等全套齐全才交付。先readTask，使用searchSdk和searchEffects读取真实SDK与组件。以workspaceBuildPreview编译真实Scene源码，返回产物后publishCandidate。发布候选时附contentGuide:{title,summary,beats,sources,visualNotes}，交可讲内容和素材出处，不交锁死的配套口播；visualNotes写真实组件输入参数、语义效果与适用范围，方便独立导播提前编排。主播结合互动自由讲述，画面导播根据待讲内容独立调控。资料须有来源。你不能直接送播、修改播放器或假称作品已显示。没有任务时停止，不制造无关内容。
                为当前播出内容设计场景，不做展示系统能力的样板页。不要自动添加「共创舞台」「本地模拟」、SDK名称、制作流程、参数更新说明或无内容价值的页眉页脚。模拟与技术状态写入制作记录，不画进节目；技术讲解节目按实际内容需要展示。
                按工具Schema填写：有payload参数的用payload对象，无payload参数的直接填写，所有写入必须带directionEpoch；新实体由运行时分配target/默认revision，修改现有实体需带expectedRevision。其他字段按工具description和简报toolContracts填写。每轮先读最新简报，不传actorId。操作完成或无必要行动就结束本轮，后台通知会再次唤醒，不要自己无限调用读取工具。
          - id: live-v2-tools
            name: dsh-livestream/agent
            config:
              v2Role: production
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
